# One time per namespace. Create with your ACR service-principal credentials:
#   kubectl create secret docker-registry acr-secret \
#     --docker-server=novastoreacr.azurecr.io --docker-username=<clientId> \
#     --docker-password=<clientSecret> -n nova-store
apiVersion: v1
kind: Secret
metadata:
  name: acr-secret
  namespace: nova-store
type: kubernetes.io/dockerconfigjson
data: {}
