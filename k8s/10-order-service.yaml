apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: nova-store
  labels:
    app: order-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      imagePullSecrets:
        - name: acr-secret
      containers:
        - name: order-service
          image: novastoreacr.azurecr.io/nova/order-service:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: nova-store-config
            - secretRef:
                name: nova-store-secrets
          env:
            - name: PORT_ORDER
              value: "3006"
          ports:
            - name: http
              containerPort: 3006
          livenessProbe:
            tcpSocket:
              port: 3006
            initialDelaySeconds: 20
            periodSeconds: 20
          readinessProbe:
            tcpSocket:
              port: 3006
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: nova-store
spec:
  selector:
    app: order-service
  ports:
    - port: 3006
      targetPort: 3006
