apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: nova-store
  labels:
    app: api-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      imagePullSecrets:
        - name: acr-secret
      containers:
        - name: api-gateway
          image: novastoreacr.azurecr.io/nova/api-gateway:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: nova-store-config
            - secretRef:
                name: nova-store-secrets
          env:
            - name: PORT_GATEWAY
              value: "8080"
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 20
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: nova-store
spec:
  selector:
    app: api-gateway
  ports:
    - port: 8080
      targetPort: 8080
