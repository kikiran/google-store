  # ---------- Review Service (3009) ------------------------------------
  review-service:
    container_name: nova-review-service
    restart: unless-stopped
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.service
      args:
        SERVICE: review-service
    env_file: .env
    environment:
      PORT_REVIEW: "3009"
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: nova
      DB_PASSWORD: nova_secret
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - nova-net
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  # ---------- Search Service (3010) ------------------------------------
  search-service:
    container_name: nova-search-service
    restart: unless-stopped
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.service
      args:
        SERVICE: search-service
    env_file: .env
    environment:
      PORT_SEARCH: "3010"
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: nova
      DB_PASSWORD: nova_secret
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - nova-net
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  # ---------- Notification Service (3011) -------------------------------
  notification-service:
    container_name: nova-notification-service
    restart: unless-stopped
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.service
      args:
        SERVICE: notification-service
    env_file: .env
    environment:
      PORT_NOTIFICATION: "3011"
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: nova
      DB_PASSWORD: nova_secret
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - nova-net
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  # ---------- Client (Vite dev) ----------------------------------------
  client:
    container_name: nova-client
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    command: npm run dev -w client -- --host 0.0.0.0
    ports:
      - "5173:5173"
    env_file: .env
    environment:
      VITE_API_URL: "http://localhost:8080/api"
    depends_on:
      api-gateway:
        condition: service_started
    networks:
      - nova-net
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  # ---------- Nginx (production reverse proxy — optional) ---------------
  nginx:
    image: nginx:alpine
    container_name: nova-nginx
    profiles:
      - prod
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./client/dist:/usr/share/nginx/html:ro
    depends_on:
      - api-gateway
    networks:
      - nova-net
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

# ---------- Volumes ----------------------------------------------------
volumes:
  nova_mysql_data:
    name: nova_mysql_data

# ---------- Networks ---------------------------------------------------
networks:
  nova-net:
    name: nova-net
    driver: bridge
