# =====================================================================
# Nova Store — Build & push all images to Azure Container Registry (ACR)
#
# Auth: Azure login via a Service Principal. Its credentials are stored
# as GitHub Actions secrets (never in the repo):
#   AZURE_CLIENT_ID, AZURE_CLIENT_SECRET, AZURE_TENANT_ID,
#   AZURE_SUBSCRIPTION_ID, ACR_LOGIN_SERVER
#
# Tags pushed per image:  latest (main only), <git-sha>, branch name,
# and <semver> on git tags (v1.2.3).
# =====================================================================

name: Build & Push to Azure Container Registry

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'services/**'
      - 'shared/**'
      - 'client/**'
      - 'infrastructure/docker/**'
      - '.github/workflows/docker-image.yml'
  workflow_dispatch:

concurrency:
  group: acr-${{ github.ref }}
  cancel-in-progress: true

env:
  ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        name:
          - api-gateway
          - auth-service
          - user-service
          - product-service
          - inventory-service
          - cart-service
          - order-service
          - payment-service
          - shipping-service
          - review-service
          - search-service
          - notification-service
          - client

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (service principal)
        uses: azure/login@v2
        with:
          auth-type: service-principal
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}

      - name: Docker metadata (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.ACR_LOGIN_SERVER }}/nova/${{ matrix.name }}
          flavor: latest=auto
          tags: |
            type=sha,prefix={{sha}}
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.name == 'client' && 'Dockerfile' || 'infrastructure/docker/Dockerfile.service' }}
          build-args: SERVICE=${{ matrix.name }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=min,scope=${{ matrix.name }}
